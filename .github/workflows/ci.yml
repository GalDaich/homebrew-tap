name: Formula CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap the checked-out formula
        run: brew tap GalDaich/tap "$GITHUB_WORKSPACE"
      - name: Install and test
        run: |
          brew install --build-from-source GalDaich/tap/brewski
          brew test GalDaich/tap/brewski
          brewski --version
      - name: Style and audit
        run: |
          brew style GalDaich/tap/brewski
          brew audit --strict GalDaich/tap/brewski
